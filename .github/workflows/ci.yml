name: CI
on:
  push:
  pull_request:
jobs:
  examples:
    name: example ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: ci/check.sh ${{ matrix.id }}
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript parses
        run: node --check site/assets/dst.js
      - name: Every page's embedded data matches site/data
        run: |
          python3 site/tools/embed.py
          git diff --exit-code -- site/*.html
